services:
  - type: web
    name: telegram-image-converter-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: PORT
        value: "10000"
